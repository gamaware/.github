name: Bug report
description: Report something that does not work as documented
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Describe the problem and where it occurs (file, workflow or lab).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands you ran, in order.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system and versions of the tools involved (for example Terraform, Python, Helm).
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Full error output. Remove any real account IDs, ARNs or credentials first.
      render: text
