name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-actions:
    name: lint-actions
    uses: ./.github/workflows/lint-actions.yml
    permissions:
      contents: read # checkout
    with:
      zizmor-persona: pedantic

  lint-docs:
    name: lint-docs
    uses: ./.github/workflows/lint-docs.yml
    permissions:
      contents: read # checkout

  secrets:
    name: secrets
    uses: ./.github/workflows/secrets.yml
    permissions:
      contents: read # checkout

  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check "pre-commit==4.6.2"

      - name: Run make verify
        run: make verify

  test-helm:
    name: test-helm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      # yq ships with the ubuntu-24.04 runner image, as helm.yml already assumes.
      - name: Run helm workflow tests
        run: make test-helm
