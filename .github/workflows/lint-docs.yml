name: lint-docs

on:
  workflow_call:
    inputs:
      markdown-globs:
        description: Newline-separated markdownlint-cli2 globs. Prefix a glob with # to exclude it.
        type: string
        default: |
          **/*.md
          #node_modules
      run-links:
        description: Check links with lychee.
        type: boolean
        default: true
      lychee-args:
        description: Arguments passed to lychee, including the paths to check.
        type: string
        default: >-
          --no-progress --max-retries 3 --accept 200..=299,403,429
          --exclude-path node_modules './**/*.md'
      run-vale:
        description: Check prose with Vale. Requires a .vale.ini at the repository root.
        type: boolean
        default: true
      vale-paths:
        description: Space-separated paths passed to Vale.
        type: string
        default: "."

permissions: {}

env:
  VALE_VERSION: "3.23.0"
  VALE_SHA256: cc35445a45186b8f0b01e11c01359694cf941e72cf6ab0fc44774f0e54c9d5fc

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: ${{ inputs.markdown-globs }}

  links:
    name: links
    if: inputs.run-links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: ${{ inputs.lychee-args }}
          fail: true
          token: ${{ github.token }}

  vale:
    name: vale
    if: inputs.run-vale
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Vale
        run: |
          set -euo pipefail
          archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/${archive}"
          echo "${VALE_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" vale
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run Vale
        env:
          VALE_PATHS: ${{ inputs.vale-paths }}
        run: |
          set -euo pipefail
          if [ ! -f .vale.ini ]; then
            echo "::error::run-vale is true but .vale.ini is missing at the repository root"
            exit 1
          fi
          vale sync
          read -ra paths <<< "$VALE_PATHS"
          vale "${paths[@]}"
