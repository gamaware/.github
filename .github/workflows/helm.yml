name: helm

on:
  workflow_call:
    inputs:
      charts:
        description: JSON array of chart directories, for example '["charts/app"]'.
        type: string
        default: '["charts"]'
      helm-version:
        description: Helm version for setup-helm.
        type: string
        default: v4.3.0
      kubernetes-version:
        description: Kubernetes version whose schemas kubeconform validates against.
        type: string
        default: "1.34.0"
      ignore-missing-schemas:
        description: Skip resources without a known schema (for example CRDs without a catalog entry).
        type: boolean
        default: false

permissions: {}

env:
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883

jobs:
  chart:
    name: chart (${{ matrix.chart }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(inputs.charts) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ inputs.helm-version }}

      - name: Install kubeconform
        run: |
          set -euo pipefail
          archive="kubeconform-linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/${archive}"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Lint, template and validate
        env:
          CHART: ${{ matrix.chart }}
          KUBERNETES_VERSION: ${{ inputs.kubernetes-version }}
          IGNORE_MISSING_SCHEMAS: ${{ inputs.ignore-missing-schemas }}
        run: |
          set -euo pipefail
          if [ "$(yq '.dependencies // [] | length' "$CHART/Chart.yaml")" != "0" ]; then
            index=0
            while IFS= read -r repository; do
              case "$repository" in
                http://* | https://*)
                  index=$((index + 1))
                  helm repo add "dependency-$index" "$repository"
                  ;;
              esac
            done < <(yq '.dependencies[].repository // ""' "$CHART/Chart.yaml")
            helm dependency build "$CHART"
          fi
          kc_args=(-strict -summary -kubernetes-version "$KUBERNETES_VERSION")
          if [ "$IGNORE_MISSING_SCHEMAS" = "true" ]; then
            kc_args+=(-ignore-missing-schemas)
          fi
          shopt -s nullglob
          # The empty entry checks the chart's own values.yaml, then each CI values file.
          values_files=("" "$CHART"/ci/*-values.yaml)
          for values in "${values_files[@]}"; do
            values_args=()
            if [ -n "$values" ]; then
              values_args=(--values "$values")
              echo "::group::$values"
            else
              echo "::group::default values"
            fi
            helm lint --strict --kube-version "$KUBERNETES_VERSION" "$CHART" "${values_args[@]}"
            helm template ci "$CHART" --kube-version "$KUBERNETES_VERSION" "${values_args[@]}" \
              | kubeconform "${kc_args[@]}"
            echo "::endgroup::"
          done
